<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOREX by BIX CARD · Presentación</title>
<meta name="description" content="KOREX by BIX CARD: presentación privada para el grupo de líderes.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="KOREX by BIX CARD">
<meta property="og:description" content="Presentación privada · Grupo de líderes">
<meta property="og:image" content="https://info.metodokorex.com/korex-card-by-bix/og.jpg">
<link rel="icon" href="/assets/mk-symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Base compartida ───────────────────────────────────────── */
:root{
  --f-title:'Audiowide',sans-serif;     /* títulos Korex: KOREX BY BIX CARD, ¿QUÉ ES KOREX? */
  --f-wide:'Orbitron',sans-serif;       /* títulos anchos AI Tech */
  --f-body:'Inter',system-ui,sans-serif;
  --cyan:#29B6F6; --cyan2:#7FD8FF; --cyan-deep:#0E8BD6;
  --txt:#FFFFFF; --soft:#C9CED8; --mut:#8A909C;
  --card:rgba(22,24,30,.82); --card-line:rgba(255,255,255,.09);
  --ease:cubic-bezier(.2,.7,.2,1);
  --s:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--txt);font-family:var(--f-body)}
body{overflow:hidden;touch-action:none;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;user-select:none;-webkit-user-drag:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* Escenario fijo 1920×1080 escalado a la pantalla */
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s));overflow:clip;background:#000}
.slide{position:absolute;inset:0;overflow:clip;isolation:isolate;opacity:0;visibility:hidden;transition:opacity .6s var(--ease),visibility 0s .6s;background:#000;font-size:24px;line-height:1.4}
.slide.on{opacity:1;visibility:visible;transition:opacity .6s var(--ease),visibility 0s}
.slide .abs{position:absolute}

/* Entrada escalonada: class="rv" + style="--d:N" */
.rv{opacity:0;transform:translateY(24px);transition:opacity .35s,transform .35s}
.slide.on .rv{opacity:1;transform:none;transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--d,0) * 90ms + 120ms)}
.rv.fade{transform:none}
.rv.zoom{transform:scale(.94)}
.slide.on .rv.zoom{transform:none}

/* Utilidades comunes */
.t-title{font-family:var(--f-title);font-weight:400;letter-spacing:.01em;line-height:1.05}
.t-wide{font-family:var(--f-wide);font-weight:800;letter-spacing:.02em;line-height:1.05}
.g-cyan{background:linear-gradient(90deg,#1FA2F0 0%,#45C2FF 55%,#9FE3FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-silver{background:linear-gradient(180deg,#FFFFFF 0%,#E6E9EE 45%,#9CA3AE 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.cyan{color:var(--cyan)}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:16px}
.glow-line{height:4px;border-radius:4px;background:radial-gradient(closest-side,#7FD8FF,#29B6F6 40%,transparent);filter:blur(1px)}

/* Fondo "seda" de las slides Korex (pie KOREX by BIX CARD) */
.bg-silk{background:
  radial-gradient(1200px 520px at 78% -8%,rgba(255,255,255,.10),transparent 60%),
  radial-gradient(900px 700px at 105% 60%,rgba(255,255,255,.07),transparent 60%),
  radial-gradient(800px 600px at -10% 90%,rgba(255,255,255,.05),transparent 60%),
  linear-gradient(180deg,#07080a,#030304)}
.bg-silk::before{content:"";position:absolute;inset:-10%;z-index:-1;pointer-events:none;opacity:.55;
  background:
   conic-gradient(from 200deg at 120% -20%,transparent 0deg,rgba(255,255,255,.10) 18deg,transparent 40deg,rgba(255,255,255,.06) 60deg,transparent 80deg),
   conic-gradient(from 20deg at -20% 120%,transparent 0deg,rgba(255,255,255,.07) 14deg,transparent 34deg);
  filter:blur(28px)}

/* Pies repetidos */
.foot-k{position:absolute;left:128px;top:985px;font-size:22px;letter-spacing:.04em;color:#9AA0AA}
.mk-k{position:absolute;left:1722px;top:982px;width:72px;filter:invert(1);opacity:.92}
.foot-a{position:absolute;left:24px;top:1036px;font-size:19px;color:#8A909C}
.mk-a{position:absolute;left:1788px;top:1026px;width:64px;filter:invert(1)}
.pg-a{position:absolute;left:1872px;top:1024px;font-size:24px;color:#9AA0AA}

/* Controles flotantes (se esconden solos) */
.ctrl{position:fixed;right:22px;bottom:20px;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;border-radius:999px;
  background:rgba(10,12,18,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .4s}
.ctrl.hide{opacity:0;pointer-events:none}
.count{font-size:13px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums;margin-right:4px}
.count b{color:#fff}
.ctrl button{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;font-size:17px;border:1px solid rgba(255,255,255,.16);transition:.25s}
.ctrl button:hover{border-color:var(--cyan);background:rgba(41,182,246,.18)}
.ctrl svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{position:fixed;left:0;bottom:0;height:3px;width:100%;z-index:5;transform-origin:0 50%;transform:scaleX(0);transition:transform .5s;background:linear-gradient(90deg,#0E8BD6,#29B6F6)}
.hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:5;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);
  background:rgba(10,12,18,.6);padding:8px 14px;border-radius:999px;transition:opacity .6s;pointer-events:none}
.hint.off{opacity:0}


/* Botones con link */
.slide a.ver,.slide a.btn{cursor:pointer;transition:filter .2s,transform .2s}
.slide a.ver:hover,.slide a.btn:hover{filter:brightness(1.25)}

/*__SLIDE_CSS__*/

/* ── Aviso "gira tu móvil" (solo celular en vertical) ───────── */
#rotate{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:#05060a;color:#fff;font-family:'Inter',system-ui,sans-serif;text-align:center;padding:24px}
@media (orientation:portrait) and (max-width:820px){html:not(.keep) #rotate{display:flex}}
#rotate .ic{position:relative;width:120px;height:120px;margin-bottom:10px}
#rotate .ph{position:absolute;left:37px;top:21px;width:46px;height:78px;border:2.5px solid #fff;border-radius:11px;animation:rt-rot 3.2s cubic-bezier(.65,0,.25,1) infinite}
#rotate .ph::after{content:"";position:absolute;left:50%;bottom:6px;width:12px;height:2.5px;margin-left:-6px;border-radius:2px;background:#fff;opacity:.55}
#rotate .ar{position:absolute;inset:0;width:120px;height:120px;fill:none;stroke:#29B6F6;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;animation:rt-ar 3.2s ease-in-out infinite}
#rotate .ttl{font-size:18px;font-weight:700;letter-spacing:.01em}
#rotate .sub{font-size:13px;color:rgba(255,255,255,.55);max-width:240px;line-height:1.5}
#rotate .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#29B6F6;box-shadow:0 0 12px #29B6F6;margin-right:8px;vertical-align:1px}
#rotate button{margin-top:26px;font:inherit;font-size:12px;color:rgba(255,255,255,.4);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@keyframes rt-rot{0%,18%{transform:rotate(0)}48%,78%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@keyframes rt-ar{0%,12%{opacity:0;transform:rotate(20deg)}30%,70%{opacity:1;transform:rotate(0)}88%,100%{opacity:0;transform:rotate(-10deg)}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(-90deg)}#rotate .ar{animation:none}}
</style>
</head>
<body>
<script>window.introWanted=location.hash==='#espera';</script>
<div id="rotate" role="dialog" aria-label="Gira tu móvil">
  <div class="ic"><svg class="ar" viewBox="0 0 120 120"><path d="M28 34a42 42 0 0 1 60-6"/><path d="M88 18v11H77"/></svg><div class="ph"></div></div>
  <div class="ttl"><span class="dot"></span>Gira tu móvil</div>
  <div class="sub">Esta presentación está pensada para verse en horizontal.</div>
  <button onclick="document.documentElement.classList.add('keep')">Ver así de todos modos</button>
</div>

<div id="stage">
<!--__SLIDES__-->
</div>
<div class="hint" id="hint">Scroll, flechas o desliza para avanzar</div>
<div class="ctrl" id="ctrl">
  <span class="count" id="count"></span>
  <button id="prev" aria-label="Slide anterior"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
  <button id="next" aria-label="Slide siguiente"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  <button id="esp" aria-label="Pantalla de espera (E)" title="Pantalla de espera (E)"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></button>
  <button id="full" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
</div>
<div class="bar" id="bar"></div>
<script>
(function(){
  var stage=document.getElementById('stage'), slides=[].slice.call(stage.querySelectorAll('.slide')), N=slides.length;
  var root=document.documentElement;
  function fit(){
    var s=Math.min(innerWidth/1920,innerHeight/1080);
    root.style.setProperty('--s',s);
  }
  addEventListener('resize',fit);fit();
  var cur=-1, count=document.getElementById('count'), bar=document.getElementById('bar'), hint=document.getElementById('hint'), ctrl=document.getElementById('ctrl');
  function pad(x){return (x<10?'0':'')+x}
  function go(i){
    i=Math.max(0,Math.min(N-1,i));if(i===cur)return;
    if(cur>-1)hint.classList.add('off');
    slides.forEach(function(s,j){s.classList.toggle('on',j===i)});
    cur=i;
    count.innerHTML='<b>'+pad(i+1)+'</b> / '+N;
    bar.style.transform='scaleX('+((i+1)/N)+')';
    history.replaceState(null,'','#'+(i+1));
  }
  var h=parseInt(location.hash.slice(1),10);
  go(h>=1&&h<=N?h-1:0);
  window.goSlide=go;

  var lockUntil=0,last=0;
  addEventListener('wheel',function(e){
    e.preventDefault();
    if(window.introActive)return;
    var now=performance.now(),gap=now-last;last=now;
    var d=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;
    if(Math.abs(d)<6)return;
    if(now<lockUntil){if(gap<140)lockUntil=Math.max(lockUntil,now+140);return}
    go(cur+(d>0?1:-1));lockUntil=now+650;
  },{passive:false});
  var tx=0,ty=0;
  addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  addEventListener('touchend',function(e){if(window.introActive)return;var dx=tx-e.changedTouches[0].clientX,dy=ty-e.changedTouches[0].clientY;
    if(Math.max(Math.abs(dx),Math.abs(dy))<40)return;go(cur+((Math.abs(dy)>Math.abs(dx)?dy:dx)>0?1:-1))},{passive:true});
  addEventListener('keydown',function(e){
    var k=e.key;
    if(window.introActive&&k!=='f'&&k!=='F')return;
    if(['ArrowDown','ArrowRight','PageDown',' ','Enter'].indexOf(k)>-1&&!e.shiftKey){e.preventDefault();go(cur+1)}
    else if(['ArrowUp','ArrowLeft','PageUp'].indexOf(k)>-1||(k===' '&&e.shiftKey)){e.preventDefault();go(cur-1)}
    else if(k==='Home')go(0);else if(k==='End')go(N-1);
    else if(k==='f'||k==='F')full();
  });
  document.getElementById('prev').onclick=function(){go(cur-1)};
  document.getElementById('next').onclick=function(){go(cur+1)};
  function full(){if(document.fullscreenElement)document.exitFullscreen();else if(root.requestFullscreen)root.requestFullscreen()}
  document.getElementById('full').onclick=full;
  document.getElementById('esp').onclick=function(){if(window.openIntro)window.openIntro()};
  var t;function wake(){ctrl.classList.remove('hide');clearTimeout(t);t=setTimeout(function(){ctrl.classList.add('hide')},2500)}
  addEventListener('mousemove',wake);addEventListener('touchstart',wake,{passive:true});wake();
})();
</script>
</body>
</html>
