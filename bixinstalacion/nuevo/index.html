<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f0a">
<meta name="robots" content="noindex">
<title>Tutorial Tarjeta BIX · Equipo Korex</title>
<meta name="description" content="Cómo activar y usar tu tarjeta BIX paso a paso.">
<meta property="og:type" content="website">
<meta property="og:title" content="Tutorial Tarjeta BIX">
<meta property="og:description" content="Activa y usa tu tarjeta BIX en 3 minutos, paso a paso.">
<meta property="og:image" content="https://info.metodokorex.com/bixinstalacion/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=IBM+Plex+Sans:wght@500;600;700&display=swap">
<style>
:root { --lima: #cafe5c; --tinta: #10140a; --fondo: #070806; --gris: #a3a998; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: radial-gradient(120% 50% at 0% 0%, #20330a 0%, transparent 60%), var(--fondo); color: #f2f5ea;
  font: 500 15px/1.45 "IBM Plex Sans", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
.tm-nav { position: static !important; }   /* el menú de tutoriales no queda pegado arriba: el video tiene más alto */
/* Video: del alto de la pantalla */
.vid { position: relative; width: min(100%, calc((100svh - 12px) * 9 / 16)); margin: 0 auto; }
.vid .voomly-embed { width: 100%; }
@media (min-width: 860px) { .vid { width: calc((100svh - var(--tm-alto, 68px) - 28px) * 9 / 16); margin-top: 12px; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px #2b3022, 0 30px 80px rgba(0,0,0,.6); } }

/* ── Reproductor de Voomly a nuestro estilo: barra de vidrio, solo barra de tiempo + volumen + pantalla completa ── */
.vid [data-cy="togglePlayButton"], .vid [class*="styles_selectSpeedWrap"], .vid [class*="styles_selectQualityWrap"], .vid [class*="logo_root"] { display: none !important; }
.vid [data-cy="controls-root"] { background: rgba(8,10,6,.38) !important; -webkit-backdrop-filter: blur(12px) saturate(140%); backdrop-filter: blur(12px) saturate(140%);
  border-radius: 14px; border: 1px solid rgba(255,255,255,.1); padding-left: 6px; padding-right: 6px; }
.vid [class*="progressBar_root"], .vid [class*="controls_buttons"] { background: transparent !important; }
.vid [class*="progressBar_track"] { background: rgba(255,255,255,.2) !important; border-radius: 6px; overflow: hidden; }
.vid [class*="progressBar_bar"] { background: var(--lima) !important; }
.vid [class*="progressBar_secondsLoaded"] { background: rgba(255,255,255,.28) !important; }
.vid [class*="progressBar_tipTime"], .vid [class*="select_popover"], .vid [class*="volume_slider"] { background: rgba(8,10,6,.72) !important; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-radius: 8px; }
.vid [class*="sliderHandle_value"] { background: var(--lima) !important; color: var(--tinta) !important; }
.vid [class*="volume_trackBg"] { background: rgba(255,255,255,.25) !important; }
.vid [class*="volume_bar"] { background: var(--lima) !important; }
.vid [class*="popoverTip_root"] { display: none !important; }
/* botón grande de play: verde BIX y redondo */
.vid [class*="playButton_icon"] rect { fill: var(--lima) !important; rx: 32px; ry: 32px; }
.vid [class*="playButton_icon"] path { fill: var(--tinta) !important; }

/* Lista de pasos debajo del video */
.lista { max-width: 560px; margin: 18px auto 0; padding: 0 16px; }
.lista h2 { margin: 0 0 2px; font: 800 17px/1.2 Sora, sans-serif; }
.lista h2 + p { margin: 0 0 12px; font-size: 13px; color: var(--gris); }
.lista button { display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 8px; padding: 12px 14px; border-radius: 14px;
  border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); text-align: left; font-size: 15px; }
.lista button .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); font-weight: 700; font-size: 13px; }
.lista button .t { margin-left: auto; color: var(--gris); font-size: 13px; }
.lista button.act { border-color: var(--lima); } .lista button.act .n { background: var(--lima); color: var(--tinta); }
footer { max-width: 560px; margin: 16px auto 0; padding: 0 16px 24px; font-size: 12px; line-height: 1.5; color: var(--gris); text-align: center; }
footer b { color: #fff; }
</style>
</head>
<body>
<script src="/reproductor/tutoriales.js"></script>
<div class="vid" id="vid">
  <div class="voomly-embed" data-id="0Y9ZUh5I5jLJjVLKhxjlBjTcD72D1BQ1ZnNxeYooNTqmfj0c-" data-ratio="0.5625" data-type="v" data-skin-color="rgb(202,254,92)"></div>
</div>
<section class="lista">
  <h2>Salta al paso que necesites</h2>
  <p>Toca un paso y el video va directo ahí</p>
  <div id="capitulos"></div>
</section>
<footer>Tutorial elaborado por <b>Equipo Korex</b>, afiliados independientes de BIX. No somos la empresa y no brindamos asesoramiento financiero. ¿Quieres saber más? Pídele información a quien te invitó.</footer>
<script src="https://embed.voomly.com/embed/embed-build.js"></script>
<script>
const CAPS = [
  { t: 0, n: '▶', titulo: 'Qué es la tarjeta BIX' },
  { t: 20.9, n: '1', titulo: 'Crea tu cuenta con el link' },
  { t: 53.2, n: '2', titulo: 'Verifica tu identidad' },
  { t: 82.0, n: '3', titulo: 'Carga USDT y crea tu tarjeta' },
  { t: 106.4, n: '4', titulo: 'Paga con el celular' },
  { t: 123.5, n: '✓', titulo: 'Así se ve una compra real' },
  { t: 132.4, n: '+', titulo: 'Extra: vincula con TAG' },
  { t: 144.2, n: '%', titulo: 'Invita y gana' },
];
const lista = document.getElementById('capitulos');
lista.innerHTML = CAPS.map((c, i) => `<button type="button" data-i="${i}"><span class="n">${c.n}</span>${c.titulo}<span class="t">${Math.floor(c.t / 60)}:${String(Math.floor(c.t % 60)).padStart(2, '0')}</span></button>`).join('');
const botones = [...lista.children];
let api = null, actual = -1;
function marcar(t) { let k = 0; CAPS.forEach((c, i) => { if (t >= c.t - 0.05) k = i; }); if (k !== actual) { actual = k; botones.forEach((b, i) => b.classList.toggle('act', i === k)); } }
lista.onclick = (e) => {
  const b = e.target.closest('[data-i]'); if (!b || !api) return;
  const t = CAPS[+b.dataset.i].t; api.seek({ time: t + 0.05 }); api.play(); marcar(t);
  document.getElementById('vid').scrollIntoView({ behavior: 'smooth', block: 'start' });
};
(function conectar() {
  if (!window.attachVoomlyPlayer || !window.voomlyEmbedPlayerPreloader) return setTimeout(conectar, 150);
  const el = document.querySelector('.voomly-embed');
  const p = window.attachVoomlyPlayer(el, el.dataset.id, 'v', el.dataset.ratio);
  p.onReady(() => { api = p; p.onTimeUpdate(({ time }) => marcar(time)); p.onSeeked(({ time }) => marcar(time)); });
})();
</script>
</body>
</html>
